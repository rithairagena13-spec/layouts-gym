<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <title>Layout Gym — Tailwind Exercises</title>
</head>
<body  class="bg-slate-100 text-slate-900 p-6 space-y-12">
 <!-- EXERCISE 1: NINE POSITIONS -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-6 border-b border-slate-200 pb-2">Exercise 1 — Nine Positions</h2>
        <div class="grid grid-cols-3 md:grid-cols-9 gap-4 text-center">
            
            <!-- 1. Top Left -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Top Left</p>
                <div class="flex items-start justify-start h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 2. Top Center -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Top Center</p>
                <div class="flex items-start justify-center h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 3. Top Right -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Top Right</p>
                <div class="flex items-start justify-end h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 4. Center Left -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Center Left</p>
                <div class="flex items-center justify-start h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 5. Absolute Center -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Absolute Center</p>
                <div class="flex items-center justify-center h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 6. Center Right -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Center Right</p>
                <div class="flex items-center justify-end h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 7. Bottom Left -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Bottom Left</p>
                <div class="flex items-end justify-start h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 8. Bottom Center -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Bottom Center</p>
                <div class="flex items-end justify-center h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

            <!-- 9. Bottom Right -->
            <div>
                <p class="text-xs font-semibold text-slate-500 mb-2">Bottom Right</p>
                <div class="flex items-end justify-end h-32 w-full bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2">
                    <div class="w-6 h-6 bg-teal-600 rounded"></div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
